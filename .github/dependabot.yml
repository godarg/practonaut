version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose: the adapter, engine build and conformance tests target this version.
      - dependency-name: "@excalidraw/excalidraw"
      # Excalidraw 0.18 runs on React 18; Node 22 is the supported runtime. Majors need a deliberate upgrade.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
