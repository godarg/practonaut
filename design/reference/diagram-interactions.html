<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'"><title>Practonaut diagram interaction prototype</title><link rel="stylesheet" href="tokens-v0.1.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--pn-color-canvas);color:var(--pn-color-text);font:var(--pn-text-md)/var(--pn-leading-body) var(--pn-font-sans)}main{max-width:66rem;margin:auto;padding:var(--pn-layout-gutter)}header,.controls{display:flex;gap:var(--pn-space-2);flex-wrap:wrap;align-items:center}h1{font:var(--pn-text-2xl)/var(--pn-leading-tight) var(--pn-font-serif)}h2{font-size:var(--pn-text-lg)}button,select{font:inherit;color:var(--pn-color-text);background:var(--pn-color-surface);border:var(--pn-border-hairline) solid var(--pn-color-border);border-radius:var(--pn-radius-control);min-height:var(--pn-target-min);padding:var(--pn-space-2) var(--pn-space-3);max-width:100%}button:disabled{border-color:transparent;color:var(--pn-color-text-muted);background:transparent}*:focus-visible{outline:var(--pn-focus-width) solid var(--pn-color-focus);outline-offset:var(--pn-focus-offset)}.bench{background:var(--pn-color-surface-sunken);padding:var(--pn-space-4)}svg{display:block;width:100%;height:auto;background:var(--pn-color-page)}rect{fill:var(--pn-color-object-bg);stroke:var(--pn-color-object-border);stroke-width:2}text{fill:var(--pn-color-object-fg);font:18px var(--pn-font-sans)}g:focus rect{stroke:var(--pn-color-focus);stroke-width:4}path{stroke:var(--pn-color-text);fill:none;stroke-width:3}marker path{fill:var(--pn-color-text)}.pending{stroke-dasharray:6 4}.panel{border-top:var(--pn-border-strong) solid var(--pn-color-border-strong);padding-top:var(--pn-space-3);margin-top:var(--pn-space-5)}.notice{background:var(--pn-color-info-bg);padding:var(--pn-space-3)}.error{background:var(--pn-color-error-bg);color:var(--pn-color-error-fg)}#status{min-height:var(--pn-space-7)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.meta{color:var(--pn-color-text-muted);font-size:var(--pn-text-sm)}@media(max-width:30em){text{font-size:18px}svg{height:330px}h1{font-size:var(--pn-text-xl)}}
</style><script src="diagram-interactions.js" defer></script></head><body><main><header><span>Practonaut</span><button id="lang">Deutsch</button><button id="theme">Dark</button></header><h1 id="title"></h1><p id="intro" class="meta"></p><section aria-labelledby="board-title"><h2 id="board-title"></h2><p id="help"></p><div class="controls"><button id="connect"></button><button id="connections"></button><button id="start"></button><button id="end"></button><button id="delete"></button><button id="cancel"></button></div><p id="status" class="notice" role="status" aria-live="polite" aria-atomic="true"></p><div class="bench"><svg id="board" viewBox="0 0 620 300" role="group"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z"/></marker></defs><path id="arrow" marker-end="url(#tip)"/><g id="s1" tabindex="0" role="button"><rect x="20" y="25" width="180" height="60"/><text x="30" y="62"></text></g><g id="s2" tabindex="-1" role="button"><rect x="420" y="25" width="180" height="60"/><text x="430" y="62"></text></g><g id="s3" tabindex="-1" role="button"><rect x="220" y="220" width="180" height="60"/><text x="230" y="257"></text></g></svg></div><div class="panel"><h2 id="relations-title"></h2><button id="relation"></button><p id="empty"></p><button id="loose"></button><p id="loose-message" class="notice error" hidden></p></div></section><section class="panel" aria-labelledby="history-title"><h2 id="history-title"></h2><ol id="history"></ol><p id="history-empty"></p><button id="undo"></button></section></main></body></html>
