name: draw.io conformance
# PADR-0049 decision 8.7: before acceptance, the draw.io layer (three runs) on macOS and Windows, by
# hand; its summaries are committed beside the Linux one. Not a required check. Linux runs the layer
# in CI (`.github/workflows/ci.yml`). The draw.io release is downloaded into a home under the
# runner's temporary folder, never cached or uploaded, and deleted at the end (tools/check-workflows.ts).
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drawio-conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  layer:
    name: draw.io layer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install chromium
      - name: draw.io runtime (setup --app drawio)
        env:
          PRACTONAUT_HOME: ${{ runner.temp }}/practonaut-drawio-home
        run: node src/cli/main.ts setup --app drawio
      - name: draw.io conformance layer
        shell: bash
        env:
          PN_DRAWIO_HOME: ${{ runner.temp }}/practonaut-drawio-home
          PN_DRAWIO_REQUIRED: '1'
        run: |
          npm run test:drawio
          node tools/require-drawio-summary.ts .local/drawio-conformance/summary.json
      - name: Upload the draw.io conformance summary
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drawio-conformance-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/drawio-conformance/summary.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Delete the draw.io runtime
        if: ${{ always() }}
        shell: bash
        env:
          PN_DRAWIO_HOME: ${{ runner.temp }}/practonaut-drawio-home
        run: rm -rf "$PN_DRAWIO_HOME"
