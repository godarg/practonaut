<!doctype html>

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' file: 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Practonaut · Player reference</title>
<link rel="stylesheet" href="tokens-v0.1.css">
<!--
  Practonaut player reference, v0.1 (2026-10-03).
  Spec: docs/design/design-language.md. Static, offline, no external requests.
  URL parameters for review renders (combine freely):
    ?lang=en|de
    ?theme=system|light|dark
    ?state=live|loading|error|picked|fail|pass|unknown|unmodeled
  Demo data only. This file is a design reference, not product code.
-->
<style>
  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; }

  html {
    font-family: var(--pn-font-sans);
    font-size: 100%;
    line-height: var(--pn-leading-body);
    color: var(--pn-color-text);
    background: var(--pn-color-canvas);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    overflow-wrap: break-word;
  }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
  main { flex: 1 0 auto; }
  h1, h2, h3, p, ol, ul, dl, dd { margin: 0; }
  ol, ul { padding: 0; list-style: none; }
  button, select { font: inherit; color: inherit; }

  :focus-visible {
    outline: var(--pn-focus-width) solid var(--pn-color-focus);
    outline-offset: var(--pn-focus-offset);
  }

  /* a11y utility; 1px is part of the technique, not a design value */
  .pn-vh {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
  }
  .pn-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

  .pn-skip {
    position: absolute; z-index: 10;
    inset-inline-start: var(--pn-space-3); inset-block-start: var(--pn-space-3);
    padding: var(--pn-space-2) var(--pn-space-4);
    background: var(--pn-color-action-bg); color: var(--pn-color-action-fg);
    transform: translateY(-300%);
  }
  .pn-skip:focus { transform: none; }

  /* ---------- Shared type helpers ---------- */
  .pn-h2 { font-size: var(--pn-text-md); font-weight: var(--pn-weight-bold); line-height: var(--pn-leading-snug); }
  .pn-h3 { font-size: var(--pn-text-sm); font-weight: var(--pn-weight-bold); line-height: var(--pn-leading-snug); }
  .pn-eyebrow {
    font-family: var(--pn-font-mono); font-size: var(--pn-text-xs);
    letter-spacing: var(--pn-tracking-caps); text-transform: uppercase;
    color: var(--pn-color-text-muted);
  }
  .pn-meta { font-family: var(--pn-font-mono); font-size: var(--pn-text-xs); color: var(--pn-color-text-muted); }
  .pn-muted { color: var(--pn-color-text-muted); }
  .pn-small { font-size: var(--pn-text-sm); }
  .pn-icon { inline-size: 1.25rem; block-size: 1.25rem; flex: none; }
  .pn-stamp { inline-size: 0.875rem; block-size: 0.875rem; flex: none; color: var(--pn-color-text); }

  /* ---------- Buttons and fields ---------- */
  .pn-actions { display: flex; flex-wrap: wrap; gap: var(--pn-space-2); }
  .pn-btn {
    display: inline-flex; align-items: center; gap: var(--pn-space-2);
    min-block-size: var(--pn-target-min);
    padding: 0 var(--pn-space-4);
    border: var(--pn-border-hairline) solid var(--pn-color-border);
    border-radius: var(--pn-radius-control);
    background: var(--pn-color-surface);
    color: var(--pn-color-text);
    font-weight: var(--pn-weight-medium);
    line-height: var(--pn-leading-tight);
    cursor: pointer;
    transition: background-color var(--pn-motion-short) var(--pn-motion-ease),
                border-color var(--pn-motion-short) var(--pn-motion-ease);
  }
  .pn-btn:hover { border-color: var(--pn-color-border-strong); }
  .pn-btn--primary {
    background: var(--pn-color-action-bg); color: var(--pn-color-action-fg);
    border-color: var(--pn-color-action-bg);
  }
  .pn-btn--primary:hover { background: var(--pn-color-action-bg-hover); border-color: var(--pn-color-action-bg-hover); }
  .pn-btn--danger {
    background: var(--pn-color-danger-bg); color: var(--pn-color-danger-fg);
    border-color: var(--pn-color-danger-bg);
  }
  .pn-btn--quiet {
    border-color: transparent; background: transparent; padding-inline: 0;
    text-decoration: underline; text-underline-offset: 0.2em;
  }
  .pn-btn--quiet:hover { border-color: transparent; text-decoration-thickness: var(--pn-border-strong); }
  /* Disabled (render review F7): the button loses its frame and fill, so the shape changes, not only
     the colour. Not dashed: dashed lines are reserved for uncertainty (spec section 2). */
  .pn-btn:disabled, .pn-btn[aria-disabled="true"],
  .pn-btn:disabled:hover, .pn-btn[aria-disabled="true"]:hover {
    cursor: not-allowed;
    color: var(--pn-color-text-muted);
    background: transparent;
    border-color: transparent;
    text-decoration: none;
  }

  .pn-field { display: flex; align-items: center; gap: var(--pn-space-2); font-size: var(--pn-text-sm); }
  .pn-select {
    min-block-size: var(--pn-target-min);
    padding: 0 var(--pn-space-3);
    border: var(--pn-border-hairline) solid var(--pn-color-border);
    border-radius: var(--pn-radius-control);
    background: var(--pn-color-surface);
    font-size: var(--pn-text-sm);
  }
  .pn-seg { display: inline-flex; border: var(--pn-border-hairline) solid var(--pn-color-border); border-radius: var(--pn-radius-control); }
  .pn-seg button {
    min-block-size: var(--pn-target-min); min-inline-size: var(--pn-target-min);
    padding: 0 var(--pn-space-3); border: 0; background: transparent; cursor: pointer;
    font-family: var(--pn-font-mono); font-size: var(--pn-text-sm);
  }
  .pn-seg button + button { border-inline-start: var(--pn-border-hairline) solid var(--pn-color-border); }
  .pn-seg button[aria-pressed="true"] { background: var(--pn-color-action-bg); color: var(--pn-color-action-fg); }
  .pn-seg button:focus-visible { position: relative; z-index: 1; }

  /* ---------- App bar ---------- */
  .pn-bar {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: var(--pn-space-2) var(--pn-space-5);
    padding: var(--pn-space-3) var(--pn-layout-gutter);
    background: var(--pn-color-surface);
    border-block-end: var(--pn-border-hairline) solid var(--pn-color-rule);
  }
  .pn-bar__id { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--pn-space-1) var(--pn-space-4); min-inline-size: 0; }
  .pn-wordmark { font-family: var(--pn-font-serif); font-size: var(--pn-text-lg); line-height: var(--pn-leading-tight); }
  /* flex gap instead of margin: no indent when the version wraps (second review G3) */
  .pn-world { font-size: var(--pn-text-sm); display: flex; flex-wrap: wrap; align-items: baseline; column-gap: var(--pn-space-2); }
  .pn-world__version { font-family: var(--pn-font-mono); font-size: var(--pn-text-xs); color: var(--pn-color-text-muted); white-space: nowrap; }
  .pn-bar__controls { margin-inline-start: auto; display: flex; flex-wrap: wrap; align-items: center; gap: var(--pn-space-3) var(--pn-space-4); }

  /* ---------- Player layout ---------- */
  .pn-player {
    display: grid;
    gap: var(--pn-layout-gutter);
    padding: var(--pn-layout-gutter);
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "task" "bench" "side" "rules";
    align-items: start;
  }
  @media (min-width: 45em) {
    .pn-player {
      grid-template-columns: minmax(0, 1fr) minmax(var(--pn-layout-panel-min), var(--pn-layout-panel-max));
      grid-template-areas: "task task" "bench side" "rules rules";
    }
  }
  @media (min-width: 72em) {
    .pn-player {
      grid-template-columns:
        minmax(var(--pn-layout-panel-min), var(--pn-layout-panel-max))
        minmax(0, 1fr)
        minmax(var(--pn-layout-panel-min), var(--pn-layout-panel-max));
      /* rows: task sheet sized by its content; bench and side span both rows */
      grid-template-rows: auto 1fr;
      grid-template-areas: "task bench side" "rules bench side";
    }
  }
  .pn-ruleset {
    grid-area: rules; min-inline-size: 0;
    border-block-start: var(--pn-border-hairline) solid var(--pn-color-rule);
    padding-block-start: var(--pn-space-4);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));
    gap: var(--pn-space-5) var(--pn-space-6);
    align-items: start;
  }

  /* ---------- Task sheet: typographic, no box ---------- */
  .pn-task {
    grid-area: task; min-inline-size: 0;
    border-block-start: var(--pn-border-strong) solid var(--pn-color-border-strong);
    padding-block-start: var(--pn-space-4);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));
    gap: var(--pn-space-5) var(--pn-space-6);
    align-items: start;
  }
  .pn-task__head { grid-column: 1 / -1; display: flex; flex-direction: column; gap: var(--pn-space-2); }
  .pn-task__title {
    font-family: var(--pn-font-serif); font-size: var(--pn-text-xl);
    font-weight: var(--pn-weight-regular); line-height: var(--pn-leading-tight);
  }
  .pn-task__brief { max-inline-size: var(--pn-measure); }
  .pn-task__block { display: flex; flex-direction: column; gap: var(--pn-space-3); min-inline-size: 0; }

  .pn-conds { display: flex; flex-direction: column; gap: var(--pn-space-3); }
  .pn-cond { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--pn-space-3); }
  .pn-cond__mark { color: var(--pn-color-text-muted); }
  .pn-cond__state { grid-column: 2; font-family: var(--pn-font-mono); font-size: var(--pn-text-xs); color: var(--pn-color-text-muted); }
  .pn-cond__id { font-family: var(--pn-font-mono); font-size: var(--pn-text-xs); color: var(--pn-color-text-muted); margin-inline-end: var(--pn-space-1); }
  .pn-cond[data-status="met"] .pn-cond__mark, .pn-cond[data-status="met"] .pn-cond__state { color: var(--pn-color-success-fg); }
  .pn-cond[data-status="notmet"] .pn-cond__mark, .pn-cond[data-status="notmet"] .pn-cond__state { color: var(--pn-color-error-fg); }
  .pn-cond[data-status="unknown"] .pn-cond__mark, .pn-cond[data-status="unknown"] .pn-cond__state { color: var(--pn-color-unknown-fg); }

  .pn-hint { border-block-start: var(--pn-border-hairline) solid var(--pn-color-rule); padding-block-start: var(--pn-space-3); }
  .pn-hint summary { cursor: pointer; font-weight: var(--pn-weight-medium); min-block-size: var(--pn-target-min); display: list-item; padding-block: var(--pn-space-2); }
  .pn-hint[open] summary { margin-block-end: var(--pn-space-2); }
  .pn-hint p + p { margin-block-start: var(--pn-space-2); }

  .pn-rules { display: flex; flex-direction: column; gap: var(--pn-space-3); }
  .pn-rule__tag {
    display: flex; align-items: center; gap: var(--pn-space-2);
    font-family: var(--pn-font-mono); font-size: var(--pn-text-xs);
    letter-spacing: var(--pn-tracking-caps); text-transform: uppercase;
    color: var(--pn-color-text-muted);
  }
  .pn-rule__text { margin-block-start: var(--pn-space-1); }

  .pn-legend {
    display: grid; grid-template-columns: auto minmax(0, 1fr);
    gap: var(--pn-space-2) var(--pn-space-3);
    font-size: var(--pn-text-sm);
    padding-block-start: var(--pn-space-3);
    border-block-start: var(--pn-border-hairline) solid var(--pn-color-rule);
  }
  .pn-legend dt { display: flex; align-items: center; gap: var(--pn-space-2); font-weight: var(--pn-weight-medium); }
  .pn-legend dd { color: var(--pn-color-text-muted); }
  .pn-task__block .pn-h3:not(:first-child) { margin-block-start: var(--pn-space-3); }
  @media (max-width: 29.99em) {
    .pn-legend { grid-template-columns: minmax(0, 1fr); row-gap: 0; }
    .pn-legend dd { padding-inline-start: calc(0.875rem + var(--pn-space-2)); margin-block-end: var(--pn-space-2); }
  }

  /* ---------- Bench and board ---------- */
  .pn-bench {
    grid-area: bench; min-inline-size: 0;
    background: var(--pn-color-surface-sunken);
    border-radius: var(--pn-radius-panel);
    padding: var(--pn-space-4);
    display: flex; flex-direction: column; gap: var(--pn-space-3);
  }
  .pn-bench__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--pn-space-3); }
  .pn-toolbar { display: flex; flex-wrap: wrap; gap: var(--pn-space-2); }
  .pn-tool { font-size: var(--pn-text-sm); padding-inline: var(--pn-space-3); }
  .pn-tool[aria-pressed="true"] { background: var(--pn-color-action-bg); color: var(--pn-color-action-fg); border-color: var(--pn-color-action-bg); }
  .pn-tool[aria-pressed="true"]:hover { background: var(--pn-color-action-bg-hover); }
  .pn-tools-legend { display: flex; align-items: center; gap: var(--pn-space-2); font-size: var(--pn-text-sm); color: var(--pn-color-text-muted); }
  .pn-board-help { font-size: var(--pn-text-sm); color: var(--pn-color-text-muted); max-inline-size: var(--pn-measure); }

  .pn-stage { display: flex; justify-content: center; padding-block: var(--pn-space-2); }
  .pn-page {
    --pn-cols: 12; --pn-rows: 18; --pn-margin: 1; --pn-third: 6;
    position: relative;
    inline-size: min(100%, var(--pn-layout-page-max));
    aspect-ratio: 2 / 3;
    aspect-ratio: var(--pn-cols) / var(--pn-rows);
    background-color: var(--pn-color-page);
    background-image:
      linear-gradient(to right, var(--pn-color-grid) 0 var(--pn-border-hairline), transparent var(--pn-border-hairline)),
      linear-gradient(to bottom, var(--pn-color-grid) 0 var(--pn-border-hairline), transparent var(--pn-border-hairline));
    background-size: calc(100% / var(--pn-cols)) calc(100% / var(--pn-rows));
    outline: var(--pn-border-hairline) solid var(--pn-color-border);
    container-type: inline-size;
  }
  .pn-guide { position: absolute; pointer-events: none; }
  .pn-guide--safe {
    inset: calc(100% / var(--pn-rows) * var(--pn-margin)) calc(100% / var(--pn-cols) * var(--pn-margin));
    border: var(--pn-border-hairline) solid var(--pn-color-guide);
  }
  .pn-guide--third {
    inset-inline: 0;
    inset-block-start: calc(100% / var(--pn-rows) * var(--pn-third));
    border-block-start: var(--pn-border-strong) solid var(--pn-color-guide);
  }

  .pn-object {
    position: absolute;
    left: calc(100% / var(--pn-cols) * var(--x));
    top: calc(100% / var(--pn-rows) * var(--y));
    width: calc(100% / var(--pn-cols) * var(--w));
    height: calc(100% / var(--pn-rows) * var(--h));
    margin: 0; padding: 0 var(--pn-space-1);
    display: flex; align-items: center; justify-content: center;
    background: var(--pn-color-object-bg);
    color: var(--pn-color-object-fg);
    border: var(--pn-border-hairline) solid var(--pn-color-object-border);
    border-radius: var(--pn-radius-none);
    font-size: clamp(var(--pn-text-xs), 3.4cqi, var(--pn-text-sm));
    line-height: 1;
    cursor: grab;
    touch-action: none;
    user-select: none;
    transition: left var(--pn-motion-move) var(--pn-motion-ease),
                top var(--pn-motion-move) var(--pn-motion-ease),
                box-shadow var(--pn-motion-short) var(--pn-motion-ease);
  }
  .pn-object__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pn-object[data-id="title"] .pn-object__label {
    font-family: var(--pn-font-serif);
    font-size: clamp(var(--pn-text-sm), 6cqi, var(--pn-text-lg));
  }
  .pn-object[data-kind="image"] {
    background-image:
      linear-gradient(to top right, transparent calc(50% - var(--pn-border-hairline)), var(--pn-color-object-cross) 50%, transparent calc(50% + var(--pn-border-hairline))),
      linear-gradient(to bottom right, transparent calc(50% - var(--pn-border-hairline)), var(--pn-color-object-cross) 50%, transparent calc(50% + var(--pn-border-hairline)));
  }
  /* label top-left: stays visible while a text object overlaps the image (render review 2026-10-03) */
  .pn-object[data-kind="image"] { align-items: flex-start; justify-content: flex-start; padding: 0; }
  .pn-object[data-kind="image"] .pn-object__label { background: var(--pn-color-object-bg); padding: var(--pn-space-1) var(--pn-space-2); border-inline-end: var(--pn-border-hairline) solid var(--pn-color-object-border); border-block-end: var(--pn-border-hairline) solid var(--pn-color-object-border); }
  .pn-object:hover { border-color: var(--pn-color-border-strong); }
  .pn-object:focus-visible { z-index: 3; }
  .pn-object[aria-pressed="true"] {
    z-index: 2;
    background: var(--pn-color-marker);
    color: var(--pn-color-marker-fg);
    border: var(--pn-border-strong) solid var(--pn-color-border-strong);
    box-shadow: var(--pn-shadow-lifted);
    cursor: grabbing;
  }
  .pn-object[aria-pressed="true"] .pn-object__label { background: transparent; }
  .pn-object.is-dragging { transition: none; cursor: grabbing; z-index: 3; }

  .pn-board-legend {
    display: flex; flex-wrap: wrap; justify-content: center; gap: var(--pn-space-2) var(--pn-space-5);
    font-size: var(--pn-text-sm); color: var(--pn-color-text-muted);
  }
  .pn-board-legend > span { display: inline-flex; align-items: center; gap: var(--pn-space-2); }
  .pn-swatch { display: inline-block; inline-size: var(--pn-space-5); border-block-start: var(--pn-border-hairline) solid var(--pn-color-guide); }
  .pn-swatch--strong { border-block-start-width: var(--pn-border-strong); }
  .pn-board-status { font-family: var(--pn-font-mono); font-size: var(--pn-text-sm); text-align: center; min-block-size: calc(var(--pn-text-sm) * var(--pn-leading-body)); }

  @media (max-width: 29.99em) {
    .pn-bench { padding: var(--pn-space-3); }
    .pn-stage { margin-inline: calc(-1 * var(--pn-space-3)); }
  }

  /* ---------- Not yet modeled ---------- */
  .pn-notice {
    display: grid; grid-template-columns: var(--pn-space-4) minmax(0, 1fr);
    background: var(--pn-color-surface);
    border: var(--pn-border-hairline) solid var(--pn-color-border);
    border-radius: var(--pn-radius-control);
  }
  .pn-notice__band { background-image: var(--pn-pattern-unmodeled); border-inline-end: var(--pn-border-hairline) solid var(--pn-color-border); }
  .pn-notice__body { padding: var(--pn-space-4); display: flex; flex-direction: column; gap: var(--pn-space-2); }
  .pn-notice__title { display: flex; align-items: center; gap: var(--pn-space-2); font-size: var(--pn-text-md); font-weight: var(--pn-weight-bold); }
  .pn-notice__related { display: flex; align-items: center; gap: var(--pn-space-2); font-size: var(--pn-text-sm); }

  /* ---------- Side panels ---------- */
  .pn-side { grid-area: side; min-inline-size: 0; display: flex; flex-direction: column; gap: var(--pn-space-5); }
  .pn-panel {
    background: var(--pn-color-surface);
    border: var(--pn-border-hairline) solid var(--pn-color-rule);
    border-radius: var(--pn-radius-panel);
    padding: var(--pn-space-4);
    display: flex; flex-direction: column; gap: var(--pn-space-3);
  }
  .pn-log__head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--pn-space-1) var(--pn-space-3); }
  .pn-entries:not(:empty) { border-block-start: var(--pn-border-hairline) solid var(--pn-color-rule); }
  .pn-entry {
    display: grid; grid-template-columns: 2.5ch minmax(0, 1fr); column-gap: var(--pn-space-3);
    padding-block: var(--pn-space-2);
    border-block-end: var(--pn-border-hairline) solid var(--pn-color-rule);
  }
  .pn-entry__n { font-family: var(--pn-font-mono); font-size: var(--pn-text-sm); color: var(--pn-color-text-muted); text-align: end; }
  .pn-entry__what { font-size: var(--pn-text-sm); font-weight: var(--pn-weight-medium); }
  .pn-entry__from { font-family: var(--pn-font-mono); font-size: var(--pn-text-xs); color: var(--pn-color-text-muted); }
  .pn-cons { margin-block-start: var(--pn-space-2); display: flex; flex-direction: column; gap: var(--pn-space-2); }
  .pn-con { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--pn-space-2); font-size: var(--pn-text-sm); }
  .pn-con .pn-stamp { margin-block-start: 0.2em; }
  .pn-con__rule { grid-column: 2; font-family: var(--pn-font-mono); font-size: var(--pn-text-xs); color: var(--pn-color-text-muted); }

  .pn-empty { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--pn-space-1) var(--pn-space-3); align-items: start; }
  .pn-empty__icon { inline-size: 1.5rem; block-size: 1.5rem; color: var(--pn-color-text-muted); grid-row: span 3; }
  .pn-empty__title { font-weight: var(--pn-weight-medium); }
  .pn-empty__body { font-size: var(--pn-text-sm); color: var(--pn-color-text-muted); }
  .pn-empty .pn-btn--quiet { justify-self: start; }

  .pn-confirm {
    display: flex; flex-direction: column; gap: var(--pn-space-3);
    padding: var(--pn-space-3);
    background: var(--pn-color-warning-bg);
    border: var(--pn-border-hairline) solid var(--pn-color-warning-border);
    border-radius: var(--pn-radius-control);
  }
  .pn-confirm__q { display: flex; gap: var(--pn-space-2); align-items: flex-start; }
  .pn-confirm__q .pn-icon { color: var(--pn-color-warning-fg); }

  /* ---------- Result check ---------- */
  .pn-result { display: flex; flex-direction: column; gap: var(--pn-space-3); }
  .pn-result:empty { display: none; }
  .pn-verdict {
    display: flex; flex-direction: column; gap: var(--pn-space-2);
    padding: var(--pn-space-3);
    border: var(--pn-border-hairline) solid var(--pn-color-rule);
    border-radius: var(--pn-radius-control);
  }
  .pn-verdict__head { display: flex; gap: var(--pn-space-2); align-items: flex-start; font-weight: var(--pn-weight-bold); }
  .pn-verdict[data-status="pass"] { background: var(--pn-color-success-bg); border-color: var(--pn-color-success-border); }
  .pn-verdict[data-status="pass"] .pn-verdict__head { color: var(--pn-color-success-fg); }
  .pn-verdict[data-status="fail"] { background: var(--pn-color-error-bg); border-color: var(--pn-color-error-border); }
  .pn-verdict[data-status="fail"] .pn-verdict__head { color: var(--pn-color-error-fg); }
  .pn-verdict[data-status="unknown"] {
    background: var(--pn-color-unknown-bg);
    border: var(--pn-border-strong) dashed var(--pn-color-unknown-border);
  }
  .pn-verdict[data-status="unknown"] .pn-verdict__head { color: var(--pn-color-unknown-fg); }
  .pn-verdict[data-status="checking"] .pn-verdict__head { color: var(--pn-color-text-muted); font-weight: var(--pn-weight-medium); }
  .pn-findings { display: flex; flex-direction: column; gap: var(--pn-space-3); }
  .pn-finding { display: flex; flex-direction: column; gap: var(--pn-space-1); font-size: var(--pn-text-sm); }
  .pn-finding__cond { font-weight: var(--pn-weight-medium); }
  .pn-finding__conseq { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--pn-space-2); }
  .pn-finding__conseq .pn-stamp { margin-block-start: 0.2em; }
  /* rule tag on its own line, as in the history (second review G1) */
  .pn-finding__conseq .pn-meta { display: block; }
  /* no orphaned last word in meta and status lines (second review G2) */
  .pn-meta, .pn-board-status { text-wrap: balance; }
  .pn-stale {
    display: flex; gap: var(--pn-space-2); align-items: flex-start;
    padding: var(--pn-space-3);
    background: var(--pn-color-info-bg); color: var(--pn-color-info-fg);
    border: var(--pn-border-hairline) solid var(--pn-color-info-border);
    border-radius: var(--pn-radius-control);
    font-size: var(--pn-text-sm);
  }

  .pn-skel { display: block; block-size: 0.75rem; background: var(--pn-color-surface-sunken); border-radius: var(--pn-radius-control); }
  .pn-skel--w60 { inline-size: 60%; }
  .pn-skel--w75 { inline-size: 75%; }
  .pn-skel--w90 { inline-size: 90%; }
  @media (prefers-reduced-motion: no-preference) {
    .pn-skel, .pn-skel-page { animation: pn-pulse var(--pn-motion-pulse) ease-in-out infinite; }
  }
  @keyframes pn-pulse { 50% { opacity: 0.55; } }

  /* ---------- Transfer case ---------- */
  .pn-transfer {
    display: flex; flex-direction: column; gap: var(--pn-space-2);
    border-block-start: var(--pn-border-strong) solid var(--pn-color-border-strong);
    padding-block-start: var(--pn-space-3);
  }

  /* ---------- World loading and load error ---------- */
  .pn-state-view {
    display: flex; flex-direction: column; gap: var(--pn-space-4);
    /* keeps the gutter on narrow screens, so the error panel never touches the viewport edge (G4) */
    inline-size: min(44rem, 100% - 2 * var(--pn-layout-gutter));
    margin: var(--pn-space-7) auto; padding: var(--pn-layout-gutter);
  }
  .pn-state-view__title { display: flex; gap: var(--pn-space-2); align-items: center; font-family: var(--pn-font-serif); font-size: var(--pn-text-xl); font-weight: var(--pn-weight-regular); line-height: var(--pn-leading-tight); }
  .pn-state-view__intro, .pn-state-view--error [role="alert"] { display: flex; flex-direction: column; gap: var(--pn-space-2); }
  .pn-state-view--error {
    background: var(--pn-color-error-bg);
    border: var(--pn-border-hairline) solid var(--pn-color-error-border);
    border-radius: var(--pn-radius-panel);
    padding: var(--pn-space-5);
  }
  .pn-state-view--error .pn-state-view__title { color: var(--pn-color-error-fg); }
  .pn-state-view--error .pn-btn:not(.pn-btn--primary) { background: transparent; }
  .pn-details summary { cursor: pointer; font-size: var(--pn-text-sm); min-block-size: var(--pn-target-min); display: list-item; padding-block: var(--pn-space-2); }
  .pn-skel-layout { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: var(--pn-space-4); align-items: start; }
  .pn-skel-col { display: flex; flex-direction: column; gap: var(--pn-space-3); }
  .pn-skel-page { aspect-ratio: 2 / 3; background: var(--pn-color-surface-sunken); border-radius: var(--pn-radius-control); }

  /* ---------- Footer ---------- */
  .pn-foot {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--pn-space-2) var(--pn-space-5);
    padding: var(--pn-space-4) var(--pn-layout-gutter);
    border-block-start: var(--pn-border-hairline) solid var(--pn-color-rule);
    font-size: var(--pn-text-sm); color: var(--pn-color-text-muted);
    background: var(--pn-color-surface);
  }

  /* ---------- Windows high contrast / forced colours ---------- */
  @media (forced-colors: active) {
    .pn-object[aria-pressed="true"] { outline: var(--pn-border-strong) solid Highlight; }
    .pn-verdict, .pn-stale, .pn-confirm, .pn-notice { border-color: CanvasText; }
  }
</style>

  /* ------------------------------------------------------------------ */
  /* Demo world. Grid units; x/y are 0-based, shown to people 1-based.   */
  /* ------------------------------------------------------------------ */
  var WORLD = {
    cols: 12, rows: 18, margin: 1, third: 6,
    /* DOM order is paint order: the image lies underneath the text objects */
    objects: [
      { id: 'image', kind: 'image', w: 8, h: 7, x: 2, y: 4 },
      { id: 'title', kind: 'text', w: 10, h: 3, x: 1, y: 7 },
      { id: 'subtitle', kind: 'text', w: 10, h: 1, x: 1, y: 17 },
      { id: 'byline', kind: 'text', w: 6, h: 1, x: 3, y: 11 }
    ],
    solved: [['title', 1, 1], ['subtitle', 1, 4], ['image', 2, 6], ['byline', 3, 14]],
    rules: [
      { id: 'R1', status: 'confirmed' },
      { id: 'R2', status: 'observed' },
      { id: 'R3', status: 'observed' },
      { id: 'R4', status: 'hypothesis' }
    ],
    conditions: ['C1', 'C2', 'C3', 'C4'],
    unmodeledTools: { resize: 'R4', rotate: null }
  };
  var FOCUS_ORDER = ['title', 'subtitle', 'image', 'byline'];
  var REF_STATES = ['live', 'loading', 'error', 'picked', 'fail', 'pass', 'unknown', 'unmodeled'];
  var CHECK_DELAY_MS = 450;
  var DIRS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };

  var params = new URLSearchParams(window.location.search);
  var state = {
    lang: STRINGS[params.get('lang')] ? params.get('lang') : 'en',
    theme: ['light', 'dark'].indexOf(params.get('theme')) >= 0 ? params.get('theme') : 'system',
    ref: REF_STATES.indexOf(params.get('state')) >= 0 ? params.get('state') : 'live',
    pos: initialPositions(),
    history: [],
    attempt: 1,
    hintUsed: false,
    check: { status: 'idle', results: null, at: null, actions: 0, stale: false },
    picked: null,
    active: FOCUS_ORDER[0],
    unmodeled: null,
    confirmingReset: false
  };
  var drag = null;

  /* ---------- helpers ---------- */
  function $(sel) { return document.querySelector(sel); }
  function t(key, p) {
    var s = STRINGS[state.lang][key];
    if (s === undefined) { s = STRINGS.en[key]; }
    if (s === undefined) { return '[' + key + ']'; }
    if (!p) { return s; }
    return s.replace(/\{(\w+)\}/g, function (m, k) { return p[k] !== undefined ? String(p[k]) : m; });
  }
  function tn(base, n, p) {
    var q = Object.assign({ n: n }, p || {});
    return t(base + (n === 1 ? '.one' : '.other'), q);
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function icon(id, cls) {
    return '<svg class="' + (cls || 'pn-icon') + '" aria-hidden="true" focusable="false"><use href="#' + id + '"></use></svg>';
  }
  function setHTML(el, html) { if (el.innerHTML !== html) { el.innerHTML = html; } }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function objDef(id) { for (var i = 0; i < WORLD.objects.length; i++) { if (WORLD.objects[i].id === id) { return WORLD.objects[i]; } } return null; }
  function ruleStatus(id) { for (var i = 0; i < WORLD.rules.length; i++) { if (WORLD.rules[i].id === id) { return WORLD.rules[i].status; } } return 'unmodeled'; }
  function name(id) { return t('obj.' + id); }
  function posText(p) { return t('pos', { col: p.x + 1, row: p.y + 1 }); }
  function joinList(items) {
    if (items.length <= 1) { return items.join(''); }
    return items.slice(0, -1).join(', ') + ' ' + t('and') + ' ' + items[items.length - 1];
  }
  function initialPositions() {
    var p = {};
    WORLD.objects.forEach(function (o) { p[o.id] = { x: o.x, y: o.y }; });
    return p;
  }
  function samePos(a, b) { return a.x === b.x && a.y === b.y; }
  function timeText(d) {
    return new Intl.DateTimeFormat(state.lang === 'de' ? 'de-DE' : 'en-GB', { hour: '2-digit', minute: '2-digit' }).format(d);
  }
  var announceTimer = null;
  function announce(msg) {
    var el = $('#pn-announcer');
    el.textContent = '';
    window.clearTimeout(announceTimer);
    announceTimer = window.setTimeout(function () { el.textContent = msg; }, 40);
  }

  /* ---------- geometry and the world's own rules ---------- */
  function rectOf(id, pos) { var o = objDef(id), p = pos[id]; return { x: p.x, y: p.y, w: o.w, h: o.h }; }
  function overlaps(a, b) { return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h; }
  function outsideSafe(r) {
    var m = WORLD.margin;
    return r.x < m || r.y < m || r.x + r.w > WORLD.cols - m || r.y + r.h > WORLD.rows - m;
  }
  function overlapPairs(pos) {
    var ids = WORLD.objects.map(function (o) { return o.id; }), out = [];
    for (var i = 0; i < ids.length; i++) {
      for (var j = i + 1; j < ids.length; j++) {
        if (overlaps(rectOf(ids[i], pos), rectOf(ids[j], pos))) { out.push([ids[i], ids[j]]); }
      }
    }
    return out;
  }
  /* consequences shown in the history: world behaviour, not a verdict */
  function consequencesFor(id, pos) {
    var r = rectOf(id, pos), out = [];
    if (outsideSafe(r)) { out.push({ key: 'cons.R2', rule: 'R2' }); }
    WORLD.objects.forEach(function (o) {
      if (o.id !== id && overlaps(r, rectOf(o.id, pos))) { out.push({ key: 'cons.R3', rule: 'R3', other: o.id }); }
    });
    return out;
  }
  /* the result checker: reads the end state only */
  function evaluate(pos) {
    var title = rectOf('title', pos), image = rectOf('image', pos), byline = rectOf('byline', pos);
    var outs = WORLD.objects.map(function (o) { return o.id; }).filter(function (id) { return outsideSafe(rectOf(id, pos)); });
    var pairs = overlapPairs(pos);
    return [
      { id: 'C1', met: title.y + title.h <= WORLD.third, find: 'find.C1', p: { row: title.y + title.h }, conseq: 'conseq.task' },
      { id: 'C2', met: outs.length === 0, find: 'find.C2', p: { names: outs }, conseq: 'conseq.R2', rule: 'R2' },
      { id: 'C3', met: byline.y >= image.y + image.h, find: 'find.C3', p: { row: byline.y + 1, end: image.y + image.h }, conseq: 'conseq.task' },
      { id: 'C4', met: pairs.length === 0, find: 'find.C4', p: { pairs: pairs }, conseq: 'conseq.R3', rule: 'R3' }
    ];
  }
  function findingText(r) {
    if (r.id === 'C2') { return t(r.find, { names: joinList(r.p.names.map(name)) }); }
    if (r.id === 'C4') {
      return t(r.find, { pairs: r.p.pairs.map(function (pr) { return t('pair', { a: name(pr[0]), b: name(pr[1]) }); }).join('; ') });
    }
    return t(r.find, r.p);
  }
  function stamp(status) { return icon('s-' + status, 'pn-stamp'); }

  /* ------------------------------------------------------------------ */
  /* Rendering                                                           */
  /* ------------------------------------------------------------------ */
  function renderStatic() {
    document.documentElement.lang = state.lang;
    document.title = t('meta.title');
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) { nodes[i].textContent = t(nodes[i].getAttribute('data-i18n')); }
    var langs = document.querySelectorAll('[data-lang]');
    for (var j = 0; j < langs.length; j++) {
      langs[j].setAttribute('aria-pressed', langs[j].getAttribute('data-lang') === state.lang ? 'true' : 'false');
    }
    $('#pn-theme').value = state.theme;
    $('#pn-ref').value = state.ref;
  }

  function renderRules() {
    var html = WORLD.rules.map(function (r) {
      return '<li class="pn-rule"><p class="pn-rule__tag">' + stamp(r.status) +
        '<span>' + esc(t('status.' + r.status)) + '</span><span aria-hidden="true">·</span><span>' + esc(r.id) + '</span></p>' +
        '<p class="pn-rule__text">' + esc(t('rule.' + r.id)) + '</p></li>';
    }).join('');
    setHTML($('#pn-rules'), html);
    var legend = ['confirmed', 'observed', 'hypothesis', 'unmodeled'].map(function (s) {
      return '<dt>' + stamp(s) + '<span>' + esc(t('status.' + s)) + '</span></dt><dd>' + esc(t('legend.' + s)) + '</dd>';
    }).join('');
    setHTML($('#pn-legend'), legend);
  }

  function conditionStatus(id) {
    var c = state.check;
    if (c.status === 'checking') { return 'checking'; }
    if (c.stale) { return 'stale'; }
    if (c.status === 'unknown') { return 'unknown'; }
    if (c.status === 'pass' || c.status === 'fail') {
      for (var i = 0; i < c.results.length; i++) { if (c.results[i].id === id) { return c.results[i].met ? 'met' : 'notmet'; } }
    }
    return 'idle';
  }
  function renderConditions() {
    var iconFor = { met: 'i-success', notmet: 'i-error', unknown: 'i-unknown', idle: 'i-pending', stale: 'i-pending', checking: 'i-pending' };
    var html = WORLD.conditions.map(function (id) {
      var s = conditionStatus(id);
      return '<li class="pn-cond" data-status="' + s + '">' +
        '<span class="pn-cond__mark">' + icon(iconFor[s]) + '</span>' +
        '<span><span class="pn-cond__id">' + esc(id) + '</span>' + esc(t('cond.' + id)) + '</span>' +
        '<span class="pn-cond__state">' + esc(t('cond.state.' + s)) + '</span></li>';
    }).join('');
    setHTML($('#pn-conds'), html);
  }

  function renderTools() {
    var u = state.unmodeled;
    var notice = $('#pn-unmodeled');
    if (!u) { notice.hidden = true; return; }
    var toolName = t('tool.' + u.tool);
    $('#pn-unmodeled-title').innerHTML = stamp('unmodeled') + '<span>' + esc(t('unmodeled.title', { tool: toolName })) + '</span>';
    $('#pn-unmodeled-body').textContent = t('unmodeled.body', { tool: toolName });
    var rel = WORLD.unmodeledTools[u.tool];
    var relEl = $('#pn-unmodeled-related');
    if (rel) {
      var rs = ruleStatus(rel);
      relEl.hidden = false;
      setHTML(relEl, stamp(rs) + '<span>' + esc(t('unmodeled.related', { rule: rel, status: t('status.' + rs) })) + ' ' + esc(t('rule.' + rel)) + '</span>');
    } else {
      relEl.hidden = true;
    }
    notice.hidden = false;
  }

  function ensureObjects() {
    var page = $('#pn-page');
    page.style.setProperty('--pn-cols', WORLD.cols);
    page.style.setProperty('--pn-rows', WORLD.rows);
    page.style.setProperty('--pn-margin', WORLD.margin);
    page.style.setProperty('--pn-third', WORLD.third);
    WORLD.objects.forEach(function (o) {
      if (page.querySelector('[data-id="' + o.id + '"]')) { return; }
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'pn-object';
      el.setAttribute('data-id', o.id);
      el.setAttribute('data-kind', o.kind);
      el.setAttribute('aria-describedby', 'pn-desc-' + o.id + ' pn-obj-help');
      el.style.setProperty('--w', o.w);
      el.style.setProperty('--h', o.h);
      el.innerHTML = '<span class="pn-object__label"></span>';
      var desc = document.createElement('span');
      desc.id = 'pn-desc-' + o.id;
      desc.className = 'pn-vh';
      el.addEventListener('keydown', onObjectKeyDown);
      el.addEventListener('pointerdown', onPointerDown);
      el.addEventListener('pointermove', onPointerMove);
      el.addEventListener('pointerup', onPointerUp);
      el.addEventListener('pointercancel', onPointerCancel);
      el.addEventListener('blur', onObjectBlur);
      page.appendChild(el);
      page.appendChild(desc);
    });
  }

  function renderBoard() {
    ensureObjects();
    var page = $('#pn-page');
    WORLD.objects.forEach(function (o) {
      var el = page.querySelector('[data-id="' + o.id + '"]');
      var p = state.pos[o.id];
      var isPicked = !!(state.picked && state.picked.id === o.id);
      el.style.setProperty('--x', p.x);
      el.style.setProperty('--y', p.y);
      el.querySelector('.pn-object__label').textContent = name(o.id);
      el.setAttribute('aria-pressed', isPicked ? 'true' : 'false');
      el.tabIndex = o.id === state.active ? 0 : -1;
      if (!isPicked) { $('#pn-desc-' + o.id).textContent = posText(p); }
    });
    var a = state.active;
    var status = state.picked
      ? t('board.status.picked', { name: name(state.picked.id), pos: posText(state.pos[state.picked.id]) })
      : (a ? t('board.status.at', { name: name(a), pos: posText(state.pos[a]) }) : t('board.status.none'));
    $('#pn-board-status').textContent = status;
  }

  function renderLog() {
    var n = state.history.length;
    $('#pn-log-meta').textContent = tn('log.meta', n, { attempt: state.attempt }) + (state.hintUsed ? t('log.meta.hint') : '');
    var html = state.history.map(function (h) {
      var cons = h.cons.map(function (c) {
        var rs = ruleStatus(c.rule);
        return '<li class="pn-con">' + stamp(rs) + '<span>' + esc(t(c.key, { other: c.other ? name(c.other) : '' })) + '</span>' +
          '<span class="pn-con__rule">' + esc(t('cons.rule', { rule: c.rule, status: t('status.' + rs) })) + '</span></li>';
      }).join('');
      return '<li class="pn-entry"><span class="pn-entry__n">' + (h.n < 10 ? '0' : '') + h.n + '</span><div>' +
        '<p class="pn-entry__what">' + esc(t('log.entry', { name: name(h.id), pos: posText(h.to) })) + '</p>' +
        '<p class="pn-entry__from">' + esc(t('log.from', { pos: posText(h.from) })) + '</p>' +
        (cons ? '<ul class="pn-cons">' + cons + '</ul>' : '') + '</div></li>';
    }).join('');
    setHTML($('#pn-entries'), html);
    $('#pn-log-empty').hidden = n > 0;
    $('#pn-undo').disabled = n === 0;
    $('#pn-reset').disabled = n === 0;
    $('#pn-log-actions').hidden = state.confirmingReset;
    $('#pn-confirm').hidden = !state.confirmingReset;
    if (state.confirmingReset) {
      $('#pn-confirm-q').textContent = tn('reset.question', n, { attempt: state.attempt });
    }
  }

  function renderCheck() {
    var c = state.check;
    var nCond = WORLD.conditions.length;
    var html = '';
    if (c.stale) {
      html += '<p class="pn-stale">' + icon('i-info') + '<span>' + esc(t('check.stale')) + '</span></p>';
    }
    if (c.status === 'checking') {
      html += '<div class="pn-verdict" data-status="checking"><p class="pn-verdict__head">' + icon('i-pending') +
        '<span>' + esc(t('check.running', { n: nCond })) + '</span></p>' +
        '<span class="pn-skel pn-skel--w90" aria-hidden="true"></span><span class="pn-skel pn-skel--w60" aria-hidden="true"></span></div>';
    } else if (c.status === 'pass' || c.status === 'fail' || c.status === 'unknown') {
      var meta = '<p class="pn-meta">' + esc(tn('check.meta', c.actions, { time: timeText(c.at), attempt: c.attempt })) + '</p>';
      if (c.status === 'pass') {
        html += '<div class="pn-verdict" data-status="pass"><p class="pn-verdict__head">' + icon('i-success') +
          '<span>' + esc(t('check.pass', { n: nCond })) + '</span></p>' + meta + '</div>';
      } else if (c.status === 'fail') {
        var bad = c.results.filter(function (r) { return !r.met; });
        var items = bad.map(function (r) {
          var conseq = r.rule
            ? '<p class="pn-finding__conseq">' + stamp(ruleStatus(r.rule)) + '<span>' + esc(t(r.conseq)) + ' <span class="pn-meta">' +
              esc(t('cons.rule', { rule: r.rule, status: t('status.' + ruleStatus(r.rule)) })) + '</span></span></p>'
            : '<p class="pn-muted">' + esc(t(r.conseq)) + '</p>';
          return '<li class="pn-finding"><p class="pn-finding__cond">' + esc(r.id) + ' · ' + esc(t('cond.' + r.id)) + '</p>' +
            '<p>' + esc(findingText(r)) + '</p>' + conseq + '</li>';
        }).join('');
        html += '<div class="pn-verdict" data-status="fail"><p class="pn-verdict__head">' + icon('i-error') +
          '<span>' + esc(t('check.fail', { bad: bad.length, n: nCond })) + '</span></p>' +
          '<ul class="pn-findings">' + items + '</ul><p class="pn-small">' + esc(t('check.next.fail')) + '</p>' + meta + '</div>';
      } else {
        html += '<div class="pn-verdict" data-status="unknown"><p class="pn-verdict__head">' + icon('i-unknown') +
          '<span>' + esc(t('check.unknown')) + '</span></p><p class="pn-small">' + esc(t('check.unknown.body')) + '</p>' +
          '<p class="pn-small">' + esc(t('check.next.unknown')) + '</p>' + meta + '</div>';
      }
    }
    var result = $('#pn-result');
    result.setAttribute('data-status', c.status);
    setHTML(result, html);
    var btn = $('#pn-check-btn');
    btn.setAttribute('aria-disabled', c.status === 'checking' ? 'true' : 'false');
    $('#pn-transfer').hidden = !(c.status === 'pass' && !c.stale);
  }

  function render() {
    renderStatic();
    renderRules();
    renderConditions();
    renderTools();
    renderBoard();
    renderLog();
    renderCheck();
  }

  /* ------------------------------------------------------------------ */
  /* Actions                                                             */
  /* ------------------------------------------------------------------ */
  function markStale() {
    var s = state.check.status;
    if (s === 'pass' || s === 'fail' || s === 'unknown') { state.check.stale = true; }
  }

  function commit(id, from, to) {
    var cons = consequencesFor(id, state.pos);
    var n = state.history.length + 1;
    state.history.push({ n: n, id: id, from: { x: from.x, y: from.y }, to: { x: to.x, y: to.y }, cons: cons });
    markStale();
    state.confirmingReset = false;
    renderConditions();
    renderLog();
    renderCheck();
    renderBoard();
    var msg = t('sr.placed', { name: name(id), pos: posText(to), n: n });
    cons.forEach(function (c) { msg += ' ' + t(c.key, { other: c.other ? name(c.other) : '' }); });
    return msg;
  }

  function pickUp(id) {
    if (state.picked) { cancelMove(false); }
    state.picked = { id: id, origin: { x: state.pos[id].x, y: state.pos[id].y } };
    state.active = id;
    renderBoard();
    announce(t('sr.picked', { name: name(id), pos: posText(state.pos[id]) }));
  }

  function moveBy(id, dx, dy) {
    var o = objDef(id), p = state.pos[id];
    var nx = clamp(p.x + dx, 0, WORLD.cols - o.w), ny = clamp(p.y + dy, 0, WORLD.rows - o.h);
    if (nx === p.x && ny === p.y) { announce(t('sr.edge', { pos: posText(p) })); return; }
    state.pos[id] = { x: nx, y: ny };
    renderBoard();
    announce(posText(state.pos[id]));
  }

  function place() {
    var pk = state.picked;
    if (!pk) { return; }
    state.picked = null;
    var now = state.pos[pk.id];
    if (samePos(now, pk.origin)) {
      renderBoard();
      announce(t('sr.same', { name: name(pk.id) }));
      return;
    }
    announce(commit(pk.id, pk.origin, now));
  }

  function cancelMove(say) {
    var pk = state.picked;
    if (!pk) { return; }
    state.pos[pk.id] = { x: pk.origin.x, y: pk.origin.y };
    state.picked = null;
    renderBoard();
    if (say) { announce(t('sr.cancel', { name: name(pk.id), pos: posText(pk.origin) })); }
  }

  function focusObject(id) {
    state.active = id;
    renderBoard();
    var el = $('#pn-page [data-id="' + id + '"]');
    if (el) { el.focus(); }
  }

  function undo() {
    if (state.picked) { cancelMove(false); }
    var last = state.history.pop();
    if (!last) { return; }
    state.pos[last.id] = { x: last.from.x, y: last.from.y };
    markStale();
    renderConditions();
    renderBoard();
    renderLog();
    renderCheck();
    if (state.history.length === 0) { $('#pn-log-title').focus(); }
    announce(t('sr.undo', { name: name(last.id), pos: posText(last.from) }));
  }

  function doReset() {
    state.pos = initialPositions();
    state.history = [];
    state.attempt += 1;
    state.hintUsed = false;
    state.check = { status: 'idle', results: null, at: null, actions: 0, stale: false };
    state.picked = null;
    state.confirmingReset = false;
    state.unmodeled = null;
    $('#pn-hint').open = false;
    render();
    $('#pn-log-title').focus();
    announce(t('sr.reset', { n: state.attempt }));
  }

  function finishCheck(forceUnknown) {
    var now = new Date();
    if (forceUnknown) {
      state.check = { status: 'unknown', results: null, at: now, actions: state.history.length, attempt: state.attempt, stale: false };
    } else {
      var res = evaluate(state.pos);
      var ok = res.every(function (r) { return r.met; });
      state.check = { status: ok ? 'pass' : 'fail', results: res, at: now, actions: state.history.length, attempt: state.attempt, stale: false };
    }
    renderConditions();
    renderCheck();
  }

  function runCheck() {
    if (state.check.status === 'checking') { return; }
    if (state.picked) { cancelMove(true); }
    state.check = { status: 'checking', results: null, at: null, actions: 0, stale: false };
    renderConditions();
    renderCheck();
    window.setTimeout(function () { finishCheck(state.ref === 'unknown'); }, CHECK_DELAY_MS);
  }

  function openUnmodeled(tool, trigger) {
    if (state.picked) { cancelMove(true); }
    state.unmodeled = { tool: tool, trigger: trigger };
    renderTools();
    $('#pn-unmodeled-title').focus();
  }
  function closeUnmodeled() {
    var trig = state.unmodeled && state.unmodeled.trigger;
    state.unmodeled = null;
    renderTools();
    if (trig) { trig.focus(); }
  }

  /* ---------- keyboard on board objects ---------- */
  function onObjectKeyDown(e) {
    var id = e.currentTarget.getAttribute('data-id');
    var k = e.key;
    var isPicked = !!(state.picked && state.picked.id === id);
    if (k === 'Enter' || k === ' ' || k === 'Spacebar') {
      e.preventDefault();
      if (e.repeat) { return; }
      if (isPicked) { place(); } else { pickUp(id); }
      return;
    }
    if (k === 'Escape') {
      if (state.picked) { e.preventDefault(); cancelMove(true); }
      return;
    }
    var d = DIRS[k];
    if (d) {
      e.preventDefault();
      if (isPicked) {
        var step = e.shiftKey ? 3 : 1;
        moveBy(id, d[0] * step, d[1] * step);
      } else {
        var i = FOCUS_ORDER.indexOf(id);
        var dir = (d[0] + d[1]) < 0 ? -1 : 1;
        focusObject(FOCUS_ORDER[(i + dir + FOCUS_ORDER.length) % FOCUS_ORDER.length]);
      }
      return;
    }
    if ((k === 'Home' || k === 'End') && !state.picked) {
      e.preventDefault();
      focusObject(k === 'Home' ? FOCUS_ORDER[0] : FOCUS_ORDER[FOCUS_ORDER.length - 1]);
    }
  }
  function onObjectBlur(e) {
    var id = e.currentTarget.getAttribute('data-id');
    if (state.picked && state.picked.id === id && !drag) { cancelMove(true); }
  }

  /* ---------- pointer: drag snaps to the grid, one drag = one action ---------- */
  function onPointerDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) { return; }
    var el = e.currentTarget, id = el.getAttribute('data-id');
    if (state.picked && state.picked.id !== id) { cancelMove(false); }
    var rect = $('#pn-page').getBoundingClientRect();
    var origin = state.picked && state.picked.id === id ? state.picked.origin : state.pos[id];
    drag = {
      id: id, pointerId: e.pointerId, sx: e.clientX, sy: e.clientY,
      start: { x: state.pos[id].x, y: state.pos[id].y },
      origin: { x: origin.x, y: origin.y },
      cw: rect.width / WORLD.cols, ch: rect.height / WORLD.rows
    };
    state.active = id;
    el.setPointerCapture(e.pointerId);
    el.classList.add('is-dragging');
    e.preventDefault();
    el.focus({ preventScroll: true });
    renderBoard();
  }
  function onPointerMove(e) {
    if (!drag || e.pointerId !== drag.pointerId) { return; }
    var o = objDef(drag.id);
    var nx = clamp(drag.start.x + Math.round((e.clientX - drag.sx) / drag.cw), 0, WORLD.cols - o.w);
    var ny = clamp(drag.start.y + Math.round((e.clientY - drag.sy) / drag.ch), 0, WORLD.rows - o.h);
    var p = state.pos[drag.id];
    if (p.x !== nx || p.y !== ny) { state.pos[drag.id] = { x: nx, y: ny }; renderBoard(); }
  }
  function onPointerUp(e) {
    if (!drag || e.pointerId !== drag.pointerId) { return; }
    var d = drag;
    drag = null;
    e.currentTarget.classList.remove('is-dragging');
    var now = state.pos[d.id];
    var wasPicked = !!(state.picked && state.picked.id === d.id);
    if (wasPicked && samePos(now, d.start)) { renderBoard(); return; }  /* a click on a picked object keeps it picked */
    state.picked = null;
    if (!samePos(now, d.origin)) { announce(commit(d.id, d.origin, now)); } else { renderBoard(); }
  }
  function onPointerCancel(e) {
    if (!drag || e.pointerId !== drag.pointerId) { return; }
    state.pos[drag.id] = { x: drag.start.x, y: drag.start.y };
    e.currentTarget.classList.remove('is-dragging');
    drag = null;
    renderBoard();
  }

  /* ---------- wiring ---------- */
  function applyTheme() {
    if (state.theme === 'system') { document.documentElement.removeAttribute('data-theme'); }
    else { document.documentElement.setAttribute('data-theme', state.theme); }
  }
  function syncUrl() {
    var q = new URLSearchParams(window.location.search);
    q.set('lang', state.lang);
    if (state.theme === 'system') { q.delete('theme'); } else { q.set('theme', state.theme); }
    try { window.history.replaceState(null, '', '?' + q.toString()); } catch (err) { /* file:// may refuse; state still applies */ }
  }

  function wire() {
    var langs = document.querySelectorAll('[data-lang]');
    for (var i = 0; i < langs.length; i++) {
      langs[i].addEventListener('click', function (e) {
        state.lang = e.currentTarget.getAttribute('data-lang');
        render();
        syncUrl();
      });
    }
    $('#pn-theme').addEventListener('change', function (e) { state.theme = e.target.value; applyTheme(); syncUrl(); });
    $('#pn-ref').addEventListener('change', function (e) {
      var q = new URLSearchParams(window.location.search);
      q.set('state', e.target.value);
      q.set('lang', state.lang);
      if (state.theme !== 'system') { q.set('theme', state.theme); }
      window.location.search = q.toString();
    });
    $('#pn-retry').addEventListener('click', function () {
      var q = new URLSearchParams(window.location.search);
      q.set('state', 'live');
      window.location.search = q.toString();
    });
    var tools = document.querySelectorAll('[data-tool]');
    for (var j = 0; j < tools.length; j++) {
      tools[j].addEventListener('click', function (e) {
        var tool = e.currentTarget.getAttribute('data-tool');
        if (tool === 'move') { return; }
        openUnmodeled(tool, e.currentTarget);
      });
    }
    $('#pn-unmodeled-close').addEventListener('click', closeUnmodeled);
    $('#pn-goto-board').addEventListener('click', function () { focusObject(state.active || FOCUS_ORDER[0]); });
    $('#pn-undo').addEventListener('click', undo);
    $('#pn-reset').addEventListener('click', function () {
      if (state.picked) { cancelMove(true); }
      state.confirmingReset = true;
      renderLog();
      $('#pn-confirm-no').focus();
    });
    $('#pn-confirm-no').addEventListener('click', function () {
      state.confirmingReset = false;
      renderLog();
      $('#pn-reset').focus();
    });
    $('#pn-confirm-yes').addEventListener('click', doReset);
    $('#pn-check-btn').addEventListener('click', runCheck);
    $('#pn-hint').addEventListener('toggle', function (e) {
      if (e.target.open && !state.hintUsed) { state.hintUsed = true; renderLog(); }
    });
    document.addEventListener('keydown', function (e) {
      var tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'select' || tag === 'textarea') { return; }
      if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === 'z' || e.key === 'Z')) {
        if (state.picked || state.history.length === 0) { return; }
        e.preventDefault();
        undo();
      }
    });
  }

  /* ---------- reference states for review renders ---------- */
  function applyRefState() {
    var player = $('#pn-player');
    if (state.ref === 'loading') { player.hidden = true; $('#pn-loading').hidden = false; return; }
    if (state.ref === 'error') { player.hidden = true; $('#pn-load-error').hidden = false; return; }
    if (state.ref === 'picked') {
      state.picked = { id: 'title', origin: { x: state.pos.title.x, y: state.pos.title.y } };
      state.active = 'title';
    }
    if (state.ref === 'pass' || state.ref === 'unknown') {
      WORLD.solved.forEach(function (s) {
        var from = { x: state.pos[s[0]].x, y: state.pos[s[0]].y };
        state.pos[s[0]] = { x: s[1], y: s[2] };
        commit(s[0], from, state.pos[s[0]]);
      });
    }
    if (state.ref === 'fail' || state.ref === 'pass') { finishCheck(false); }
    if (state.ref === 'unknown') { finishCheck(true); }
    if (state.ref === 'unmodeled') { state.unmodeled = { tool: 'resize', trigger: $('[data-tool="resize"]') }; }
  }

  applyTheme();
  wire();
  render();
  applyRefState();
  render();
  if (state.ref === 'picked') { var pe = $('#pn-page [data-id="title"]'); if (pe) { pe.focus({ preventScroll: true }); } }
})();
</script>
</body>
</html>
